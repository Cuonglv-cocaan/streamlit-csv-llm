<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Where to go next: three horizons beyond Chat with Your CSV</title>
  <desc>A roadmap diagram. The foundation box shows the app the student just built. Three horizon boxes branch out: RAG for long-form text, Code Execution for exact answers, Agents and Tool Use for multi-step workflows. A wisdom callout at the bottom advises shipping the current app before reaching for any of the three horizons.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="920" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="42" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">
    Where to go next
  </text>
  <text x="600" y="65" font-size="13" text-anchor="middle" fill="#64748b">
    Three horizons beyond Chat with Your CSV  ·  Lecture 34
  </text>

  <!-- ============ Foundation: Where you are now ============ -->
  <g>
    <rect x="320" y="92" width="560" height="90" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="600" y="120" font-size="15" font-weight="700" text-anchor="middle" fill="#064e3b">
      ✅  Where you are now
    </text>
    <text x="600" y="143" font-size="14" font-weight="600" text-anchor="middle" fill="#065f46">
      Chat with Your CSV
    </text>
    <text x="600" y="163" font-size="11" text-anchor="middle" fill="#047857">
      streaming chat  ·  metric dashboard  ·  auto visualizations  ·  password gate  ·  deployed
    </text>
  </g>

  <!-- ============ Forking arrows to three horizons ============ -->
  <g fill="none" stroke="#475569" stroke-width="2">
    <!-- Trunk down from foundation -->
    <path d="M 600 182 L 600 230"/>
    <!-- Horizontal beam -->
    <path d="M 245 230 L 955 230"/>
    <!-- Three drops -->
    <path d="M 245 230 L 245 273" marker-end="url(#arrow)"/>
    <path d="M 600 230 L 600 273" marker-end="url(#arrow)"/>
    <path d="M 955 230 L 955 273" marker-end="url(#arrow)"/>
  </g>

  <!-- ============ Horizon 1: RAG ============ -->
  <g>
    <rect x="85" y="275" width="320" height="400" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>

    <!-- Number badge -->
    <circle cx="120" cy="310" r="22" fill="#a855f7" stroke="#7c3aed" stroke-width="2"/>
    <text x="120" y="318" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>

    <!-- Header -->
    <text x="160" y="305" font-size="18" font-weight="700" fill="#581c87">📚  RAG</text>
    <text x="160" y="326" font-size="11" font-style="italic" fill="#6b21a8">Retrieval Augmented Generation</text>

    <line x1="100" y1="350" x2="390" y2="350" stroke="#c084fc" stroke-width="1"/>

    <!-- When -->
    <text x="100" y="372" font-size="11" font-weight="700" fill="#6b21a8">When you need it</text>
    <text x="100" y="392" font-size="12" fill="#1f2937">When your data is long-form text,</text>
    <text x="100" y="410" font-size="12" fill="#1f2937">not tabular rows.</text>
    <text x="100" y="430" font-size="11" fill="#6b7280">Docs, wikis, support tickets, articles,</text>
    <text x="100" y="446" font-size="11" fill="#6b7280">contracts, anything text-heavy.</text>

    <line x1="100" y1="470" x2="390" y2="470" stroke="#c084fc" stroke-width="1"/>

    <!-- Tools -->
    <text x="100" y="492" font-size="11" font-weight="700" fill="#6b21a8">Tools to explore</text>
    <text x="100" y="513" font-size="12" fill="#1f2937">•  LangChain</text>
    <text x="100" y="531" font-size="12" fill="#1f2937">•  LlamaIndex</text>
    <text x="100" y="549" font-size="12" fill="#1f2937">•  Chroma  ·  Weaviate</text>
    <text x="100" y="567" font-size="12" fill="#1f2937">•  Pinecone  ·  pgvector</text>

    <line x1="100" y1="591" x2="390" y2="591" stroke="#c084fc" stroke-width="1"/>

    <!-- Example -->
    <text x="100" y="613" font-size="11" font-weight="700" fill="#6b21a8">Example use case</text>
    <text x="100" y="635" font-size="12" font-style="italic" fill="#374151">"Chat with my company's</text>
    <text x="100" y="653" font-size="12" font-style="italic" fill="#374151">internal wiki"</text>
  </g>

  <!-- ============ Horizon 2: Code Execution ============ -->
  <g>
    <rect x="440" y="275" width="320" height="400" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>

    <!-- Number badge -->
    <circle cx="475" cy="310" r="22" fill="#d97706" stroke="#b45309" stroke-width="2"/>
    <text x="475" y="318" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>

    <!-- Header -->
    <text x="515" y="305" font-size="18" font-weight="700" fill="#78350f">⚡  Code Execution</text>
    <text x="515" y="326" font-size="11" font-style="italic" fill="#92400e">Sandboxed code for exact answers</text>

    <line x1="455" y1="350" x2="745" y2="350" stroke="#fbbf24" stroke-width="1"/>

    <!-- When -->
    <text x="455" y="372" font-size="11" font-weight="700" fill="#92400e">When you need it</text>
    <text x="455" y="392" font-size="12" fill="#1f2937">When users want real numbers,</text>
    <text x="455" y="410" font-size="12" fill="#1f2937">not summaries.</text>
    <text x="455" y="430" font-size="11" fill="#6b7280">Top-N rows, exact aggregates,</text>
    <text x="455" y="446" font-size="11" fill="#6b7280">computed values, joins, plots.</text>

    <line x1="455" y1="470" x2="745" y2="470" stroke="#fbbf24" stroke-width="1"/>

    <!-- Tools -->
    <text x="455" y="492" font-size="11" font-weight="700" fill="#92400e">Tools to explore</text>
    <text x="455" y="513" font-size="12" fill="#1f2937">•  OpenAI Code Interpreter</text>
    <text x="455" y="531" font-size="12" fill="#1f2937">•  E2B  ·  Riza</text>
    <text x="455" y="549" font-size="12" fill="#1f2937">•  Modal  ·  Daytona</text>
    <text x="455" y="567" font-size="12" fill="#1f2937">•  custom Python sandbox</text>

    <line x1="455" y1="591" x2="745" y2="591" stroke="#fbbf24" stroke-width="1"/>

    <!-- Example -->
    <text x="455" y="613" font-size="11" font-weight="700" fill="#92400e">Example use case</text>
    <text x="455" y="635" font-size="12" font-style="italic" fill="#374151">"Show me the 10 trips with</text>
    <text x="455" y="653" font-size="12" font-style="italic" fill="#374151">the highest fares"</text>
  </g>

  <!-- ============ Horizon 3: Agents & Tool Use ============ -->
  <g>
    <rect x="795" y="275" width="320" height="400" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>

    <!-- Number badge -->
    <circle cx="830" cy="310" r="22" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
    <text x="830" y="318" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>

    <!-- Header -->
    <text x="870" y="305" font-size="18" font-weight="700" fill="#7f1d1d">🤖  Agents</text>
    <text x="870" y="326" font-size="11" font-style="italic" fill="#991b1b">Model picks tools, chains calls</text>

    <line x1="810" y1="350" x2="1100" y2="350" stroke="#fca5a5" stroke-width="1"/>

    <!-- When -->
    <text x="810" y="372" font-size="11" font-weight="700" fill="#991b1b">When you need it</text>
    <text x="810" y="392" font-size="12" fill="#1f2937">When you need multi-step</text>
    <text x="810" y="410" font-size="12" fill="#1f2937">workflows the model drives.</text>
    <text x="810" y="430" font-size="11" fill="#6b7280">Querying DBs, calling APIs,</text>
    <text x="810" y="446" font-size="11" fill="#6b7280">sending emails, hitting webhooks.</text>

    <line x1="810" y1="470" x2="1100" y2="470" stroke="#fca5a5" stroke-width="1"/>

    <!-- Tools -->
    <text x="810" y="492" font-size="11" font-weight="700" fill="#991b1b">Tools to explore</text>
    <text x="810" y="513" font-size="12" fill="#1f2937">•  OpenAI Function Calling</text>
    <text x="810" y="531" font-size="12" fill="#1f2937">•  Anthropic Agent SDK</text>
    <text x="810" y="549" font-size="12" fill="#1f2937">•  LangChain Agents</text>
    <text x="810" y="567" font-size="12" fill="#1f2937">•  CrewAI  ·  AutoGen</text>

    <line x1="810" y1="591" x2="1100" y2="591" stroke="#fca5a5" stroke-width="1"/>

    <!-- Example -->
    <text x="810" y="613" font-size="11" font-weight="700" fill="#991b1b">Example use case</text>
    <text x="810" y="635" font-size="12" font-style="italic" fill="#374151">"Find low-tipping zones,</text>
    <text x="810" y="653" font-size="12" font-style="italic" fill="#374151">generate a report, email it"</text>
  </g>

  <!-- ============ Bottom wisdom callout ============ -->
  <g>
    <rect x="80" y="720" width="1040" height="155" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="0"/>

    <text x="600" y="755" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">
      🚀  One practical piece of advice
    </text>
    <line x1="450" y1="768" x2="750" y2="768" stroke="#94a3b8" stroke-width="1"/>

    <text x="600" y="795" font-size="13" text-anchor="middle" fill="#1e293b">
      Don't make an agent your first LLM app.
    </text>
    <text x="600" y="816" font-size="13" text-anchor="middle" fill="#334155">
      What you just built is already more useful than 80% of the "AI tools" people launch.
    </text>
    <text x="600" y="844" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">
      Ship it.  Get real users.  Real usage will tell you which horizon matters next.
    </text>
  </g>

</svg>
